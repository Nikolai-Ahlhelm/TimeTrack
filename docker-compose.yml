services:
  timetrack:
    image: ghcr.io/nikolai-ahlhelm/timetrack:latest
    # Or build from source instead of using the published image:
    # build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      JWT_SECRET: "<a long random secret>"
    volumes:
      - timetrack-data:/app/data

volumes:
  timetrack-data:
