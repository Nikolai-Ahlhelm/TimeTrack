services:
  timetrack:
    build: .
    image: timetrack:local
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your environment or a .env file}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    volumes:
      - timetrack-data:/app/data
    restart: unless-stopped

volumes:
  timetrack-data:
